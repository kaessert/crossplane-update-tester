# The namespaced counterpart to dualscope-cluster.yaml: same Kind, same
# metadata.name, differing only in namespace and apiVersion group.
# hack/smoke-test.sh exercises this fixture in both directions: first as
# the quiet sibling, confirming events recorded for the CLUSTER-SCOPED
# sibling never count toward this one's converge check; then its own
# update-test field IS exercised via `run`, and the cluster-scoped sibling
# is re-checked to confirm isolation holds the other way too.
apiVersion: dualscope.m.example.crossplane.io/v1alpha1
kind: DualScope
metadata:
  name: example-dualscope
  namespace: crossplane-e2e
  annotations:
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
spec:
  forProvider:
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    name: default
